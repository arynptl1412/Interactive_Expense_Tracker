<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div id="main">

        <div>
            <h1>SpendSync</h1>

            <form>
                <div id="expense-name-div">
                    <label for="expense-name">Name</label>
                    <input type="text" id="expense-name">
                </div>

                <div id="expense-amount-div">
                    <label for="expense-amount">Amount</label>
                    <input type="number" step="0.01" id="expense-amount">
                </div>

                <button type="submit">Submit</button>
            </form>

            <ul id="expense-list">
                <!-- <li class="expense-item">
                    <span class="expense-name">Coffee</span>
                    <span class="expense-amount">$4.50</span>
                </li> -->
            </ul>
        </div>

        <p id="total-amount">₹0.00</p>

    </div>

    <script src="./script.js"></script>
</body>

</html>
